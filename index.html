<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>둥둥 그림 전시회</title>
<link rel="stylesheet" href="./style.css"><script defer src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script><script defer src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script><script defer src="./app.js"></script></head>
<body><header><button class="brand" id="home"><span>🥚</span><span>둥둥 그림 전시회<small>DRAW. SHARE. SMILE.</small></span></button><nav><button id="help">ⓘ 사용 방법</button> <button id="demo">먼저 체험하기 ↗</button></nav></header>
<main id="app"></main><footer>그림 한 장으로, 조금 더 가까이. <small>✦ MADE FOR OUR CLASS</small></footer>
<dialog id="modal"><button id="close" aria-label="닫기">×</button><div id="modal-body"></div></dialog>
<template id="landing"><div class="hero"><section><p class="eyebrow">● 우리 반 작은 그림 전시회</p><h1>우리 반 그림이<br>하나둘 <em>둥둥</em><b>.</b></h1><p>서툰 선도, 삐뚤한 눈도 괜찮아요.<br>내가 그린 친구가 귀여운 계란이 되어 떠올라요.</p><div class="row"><button class="primary" data-act="setup">우리 반 전시회 열기 →</button><button class="yellow" data-act="help">ⓘ 사용 방법<br><small>처음이라면 여기부터</small></button></div><p class="eyebrow">✎ 그리고 · 감상하고 · 함께 맞혀봐요</p></section><section class="arch"><p class="eyebrow">OUR LITTLE GALLERY　✧</p><div class="eggs" id="samples"></div><small>잘 그리는 것보다, 함께 그리는 즐거움</small></section></div>
<div class="entry card"><button data-act="setup"><small>FOR TEACHERS</small><strong>선생님, 전시회를 열어주세요</strong>명단을 넣고 초대 링크로 함께 시작해요.</button><form id="join"><small>FOR STUDENTS</small><label for="code"><strong>학생은 여기로 입장해요</strong></label><div class="row"><input id="code" maxlength="8" required placeholder="방 코드"><button class="primary" aria-label="방 코드로 입장">→</button></div><span id="join-error" role="status"></span></form></div>
<div class="row archive"><button data-act="archive">수업 보관함</button><button data-act="import">수업 백업 불러오기</button></div><section class="closing"><small>ONE DRAWING, MANY SMILES</small><h2>그림마다, 작은 이야기가 있어요.</h2><p>친구 얼굴부터 동물과 캐릭터까지.</p></section></template>
<template id="setup"><div class="layout"><aside><p class="eyebrow">LET’S MAKE A LITTLE GALLERY</p><h1>오늘은 어떤<br>전시회를 열까요?</h1><p>명단과 주제를 정하면 준비 끝.<br>나머지는 아이들의 상상에 맡겨주세요.</p><div class="arch mini"><div class="eggs" id="setup-eggs"></div></div><p>수업 중에는 교사 화면을 열어두세요.<br>기록은 이 브라우저에 저장돼요.</p></aside>
<form id="create"><section class="card"><h2><span>01</span> 우리 반을 소개해주세요</h2><label>전시회 이름<input name="title" required maxlength="60" value="우리 반 작은 전시회"></label><label>학생 명단 <small>한 줄에 한 명 · 최대 40명</small><textarea name="names" required rows="5" placeholder="민서&#10;지우&#10;하준&#10;서연"></textarea></label><small id="count">0명 입력됨 · 동명이인은 번호로 구분해요</small></section>
<section class="card"><h2><span>02</span> 오늘의 그리기 주제</h2><div class="options"><label><input type="radio" name="theme" value="friends" checked>우리 반 친구</label><label><input type="radio" name="theme" value="free">자유 주제 목록</label></div><label id="topics" hidden>그릴 대상 <small>한 줄에 하나씩</small><textarea name="topics" rows="3" placeholder="고양이&#10;토끼&#10;우주인"></textarea></label></section>
<section class="card"><h2><span>03</span> 그리기와 퀴즈 방식</h2><p>그릴 대상은 어떻게 정할까요?</p><div class="options"><label><input type="radio" name="assign" value="random" checked>비밀 랜덤 배정</label><label><input type="radio" name="assign" value="choose">자유롭게 선택</label></div><p>퀴즈 점수를 모을까요?</p><div class="options"><label><input type="radio" name="scoring" value="no" checked>함께 맞히기</label><label><input type="radio" name="scoring" value="yes">점수 모으기</label></div></section>
<button class="primary wide">전시회 만들고 초대하기 →</button><p id="form-error" role="status"></p></form></div></template>
<template id="drawing"><div class="layout draw"><section class="card"><p class="eyebrow">✦ 나만의 작은 작업실</p><div class="paper"><canvas id="canvas" width="512" height="512" aria-label="친구 얼굴 그림판"></canvas></div><div class="row palette" id="palette" aria-label="펜 색상"></div><div class="row tools"><button data-tool="pen">펜</button><button data-tool="erase">지우개</button><label>굵기 <input id="width" type="range" min="2" max="32" value="8"></label><button data-tool="undo">되돌리기</button><button data-tool="redo">다시 실행</button><button data-tool="clear">모두 지우기</button></div></section><aside class="card"><p class="eyebrow">쉿! 나에게만 알려주는 비밀</p><div id="target"></div><h2>닮아도 좋고,<br>조금 달라도 좋아요.</h2><p>머리 모양, 안경, 웃는 표정을 떠올려 보세요. 완성한 그림은 교실 화면에서 계란이 되어 사뿐히 떠올라요.</p><button id="send" class="primary">전시회로 그림 보내기 →</button><p id="draw-status" role="status"></p></aside></div></template>
</body></html>
