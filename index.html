<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>둥둥 그림 전시회</title>
<link rel="stylesheet" href="./style.css"><script defer src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script><script defer src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script><script defer src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script><script defer src="./roster.js"></script><script defer src="./app.js"></script></head>
<body><header><button class="brand" id="home"><span>🥚</span><span>둥둥 그림 전시회<small>DRAW. SHARE. SMILE.</small></span></button><nav><button id="help">ⓘ 사용 방법</button> <button id="demo">먼저 체험하기 ↗</button></nav></header>
<main id="app"></main><footer>그림 한 장으로, 조금 더 가까이. <small>✦ MADE FOR OUR CLASS</small></footer>
<dialog id="modal"><button id="close" aria-label="닫기">×</button><div id="modal-body"></div></dialog>
<template id="landing"><div class="hero"><section><p class="eyebrow">● 우리 반 작은 그림 전시회</p><h1>우리 반 그림이<br>하나둘 <em>둥둥</em><b>.</b></h1><p>서툰 선도, 삐뚤한 눈도 괜찮아요.<br>내가 그린 친구가 귀여운 계란이 되어 떠올라요.</p><div class="row"><button class="primary" data-act="setup">우리 반 전시회 열기 →</button><button class="yellow" data-act="help">ⓘ 사용 방법<br><small>처음이라면 여기부터</small></button></div><p class="eyebrow">✎ 그리고 · 감상하고 · 함께 맞혀봐요</p></section><section class="arch"><p class="eyebrow">OUR LITTLE GALLERY　✧</p><div class="eggs" id="samples"></div><small>잘 그리는 것보다, 함께 그리는 즐거움</small></section></div>
<div class="entry card"><button data-act="setup"><small>FOR TEACHERS</small><strong>선생님, 전시회를 열어주세요</strong>명단을 넣고 초대 링크로 함께 시작해요.</button><form id="join"><small>FOR STUDENTS</small><label for="code"><strong>학생은 여기로 입장해요</strong></label><div class="row"><input id="code" maxlength="8" required placeholder="방 코드"><button class="primary" aria-label="방 코드로 입장">→</button></div><span id="join-error" role="status"></span></form></div>
<div class="row archive"><button data-act="archive">수업 보관함</button><button data-act="import">수업 백업 불러오기</button></div><section class="closing"><small>ONE DRAWING, MANY SMILES</small><h2>그림마다, 작은 이야기가 있어요.</h2><p>친구 얼굴부터 동물과 캐릭터까지.</p></section></template>
<template id="setup"><div class="layout"><aside><p class="eyebrow">LET’S MAKE A LITTLE GALLERY</p><h1>오늘은 어떤<br>전시회를 열까요</h1><p>명단과 주제를 정하면 준비 끝.<br>나머지는 아이들의 상상에 맡겨주세요.</p><div class="arch mini"><div class="eggs" id="setup-eggs"></div></div><p>수업 중에는 교사 화면을 열어두세요.<br>기록은 이 브라우저에 저장돼요.</p></aside>
<form id="create"><section class="card"><h2><span>01</span> 우리 반을 소개해주세요</h2><label>전시회 이름<input name="title" required maxlength="60" value="우리 반 작은 전시회"></label><div class="roster-import"><label class="file-label" for="roster-file"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zM14 2v6h6M9 12l6 6m0-6-6 6"/></svg>엑셀 학생 명렬표 불러오기</label><input id="roster-file" type="file" accept=".xlsx,.xls" aria-describedby="roster-help"><p id="roster-help">엑셀의 이름·성명 열을 찾아 입력해요. 명단은 이 브라우저에 저장돼요.</p><div id="roster-mapping" hidden><label>시트<select id="roster-sheet"></select></label><div class="mapping-fields"><label>학생 이름 열<select id="roster-column"></select></label><label>첫 학생이 있는 행<input id="roster-start" type="number" min="1" max="10000" value="2"></label></div></div><p id="roster-status" role="status" aria-live="polite"></p></div><label>학생 명단 <small>한 줄에 한 명 · 최대 40명</small><textarea name="names" required rows="5" placeholder="민서&#10;지우&#10;하준&#10;서연"></textarea></label><small id="count">0명 입력됨 · 동명이인은 번호로 구분해요</small></section>
<section class="setup-section"><h2><span>02</span> 오늘의 그리기 주제</h2><div class="choice-grid" role="group" aria-label="오늘의 그리기 주제"><label class="choice"><input type="radio" name="theme" value="friends" checked><span class="choice-content"><svg class="choice-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="7" r="3"/><path d="M3 21v-3a6 6 0 0 1 12 0v3M16 4a3 3 0 0 1 0 6m2 4a5 5 0 0 1 3 4v3"/></svg><strong>우리 반 친구</strong><small>명단 속 친구를 그려요</small></span></label><label class="choice"><input type="radio" name="theme" value="free"><span class="choice-content"><svg class="choice-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18h1a3 3 0 0 0 2-5c-1-1 0-2 1-2h2a3 3 0 0 0 3-3 9 9 0 0 0-9-8z"/><circle cx="7" cy="10" r=".8"/><circle cx="10" cy="6.5" r=".8"/><circle cx="15" cy="7" r=".8"/><circle cx="6.5" cy="14" r=".8"/></svg><strong>자유 주제 목록</strong><small>동물, 캐릭터, 무엇이든</small></span></label></div><label id="topics" hidden>그릴 대상 <small>한 줄에 하나씩</small><textarea name="topics" rows="3" placeholder="고양이&#10;토끼&#10;우주인"></textarea></label></section>
<section class="setup-section"><h2><span>03</span> 그리기와 퀴즈 방식</h2><p class="choice-question" id="assignment-label">그릴 대상은 어떻게 정할까요?</p><div class="choice-grid" role="group" aria-labelledby="assignment-label"><label class="choice"><input type="radio" name="assign" value="random" checked><span class="choice-content"><svg class="choice-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h3c5 0 7 12 12 12h3m-4-4 4 4-4 4M3 18h3c2 0 3-2 4-4m4-4c1-2 2-4 4-4h3m-4-4 4 4-4 4"/></svg><strong>비밀 랜덤 배정</strong><small>나에게만 살짝 알려줘요</small></span></label><label class="choice"><input type="radio" name="assign" value="choose"><span class="choice-content"><svg class="choice-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m4 16-1 5 5-1L20 8l-4-4zM13 7l4 4M4 16l4 4"/></svg><strong>자유롭게 선택</strong><small>그리고 싶은 대상을 골라요</small></span></label></div><p class="choice-question" id="scoring-label">퀴즈 점수를 모을까요?</p><div class="score-switch" role="group" aria-labelledby="scoring-label"><label class="choice"><input type="radio" name="scoring" value="no" checked><span class="choice-content"><svg class="choice-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.3 6.7L21 12l-6.7 2.3L12 21l-2.3-6.7L3 12l6.7-2.3zM20 2v4m-2-2h4"/></svg><strong>함께 맞히기</strong></span></label><label class="choice"><input type="radio" name="scoring" value="yes"><span class="choice-content"><svg class="choice-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3h8v7a4 4 0 0 1-8 0zM8 5H3v2a5 5 0 0 0 5 5m8-7h5v2a5 5 0 0 1-5 5M12 14v6m-5 1h10"/></svg><strong>점수 모으기</strong></span></label></div><p class="choice-note">두 모드 모두 학생이 답을 제출하고 선생님이 정답을 공개해요.</p></section>
<button class="primary wide">전시회 만들고 초대하기 →</button><p id="form-error" role="status"></p></form></div></template>
<template id="drawing"><div class="layout draw"><section class="card"><p class="eyebrow">✦ 나만의 작은 작업실</p><div class="paper"><canvas id="canvas" width="512" height="512" aria-label="친구 얼굴 그림판"></canvas></div><div class="row palette" id="palette" aria-label="펜 색상"></div><div class="row tools"><button data-tool="pen">펜</button><button data-tool="erase">지우개</button><label>굵기 <input id="width" type="range" min="2" max="32" value="8"></label><button data-tool="undo">되돌리기</button><button data-tool="redo">다시 실행</button><button data-tool="clear">모두 지우기</button></div></section><aside class="card"><p class="eyebrow">쉿! 나에게만 알려주는 비밀</p><div id="target"></div><h2>닮아도 좋고,<br>조금 달라도 좋아요.</h2><p>머리 모양, 안경, 웃는 표정을 떠올려 보세요. 완성한 그림은 교실 화면에서 계란이 되어 사뿐히 떠올라요.</p><button id="send" class="primary">전시회로 그림 보내기 →</button><p id="draw-status" role="status"></p></aside></div></template>
</body></html>
